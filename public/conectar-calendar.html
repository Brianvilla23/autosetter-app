<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <!-- Set completo: el SVG manda en navegadores modernos; el PNG es el que
       usan Safari viejo, Android y los crawlers de link preview (WhatsApp,
       Meta) que no renderizan favicon SVG. -->
  <link rel="icon" href="/icon-1024.png" type="image/png" sizes="1024x1024">
  <link rel="apple-touch-icon" href="/icon-1024.png">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conectar Google Calendar — Atinov</title>
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { max-width: 460px; padding: 40px; text-align: center; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; }
    h1 { font-size: 1.4rem; margin-bottom: 14px; }
    p { color: rgba(255,255,255,.65); font-size: 15px; line-height: 1.6; margin-bottom: 22px; }
    button { background: #fff; color: #0a0a0a; border: 0; border-radius: 8px; padding: 13px 26px; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    .msg { margin-top: 18px; font-size: 14px; color: rgba(255,255,255,.75); min-height: 20px; }
    a { color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📅 Conectar Google Calendar</h1>
    <p>Tu agente podrá ver la disponibilidad real y agendar citas directamente en tu calendario, sin sacar al cliente de la conversación.</p>
    <button id="btn">Conectar con Google</button>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');
    btn.addEventListener('click', async () => {
      const token = localStorage.getItem('autosetter_token');
      if (!token) { msg.innerHTML = 'Primero inicia sesión en <a href="/app">tu panel</a> y vuelve a esta página.'; return; }
      btn.disabled = true; msg.textContent = 'Generando permiso…';
      try {
        const r = await fetch('/api/calendar/connect', { headers: { Authorization: 'Bearer ' + token } });
        const data = await r.json();
        if (!r.ok || !data.url) throw new Error(data.error || 'No se pudo generar el permiso');
        msg.textContent = 'Redirigiendo a Google…';
        window.location.href = data.url;
      } catch (e) {
        btn.disabled = false;
        msg.textContent = '⚠️ ' + e.message;
      }
    });
  </script>
</body>
</html>
